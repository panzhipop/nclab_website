name: Deploy to GitHub Pages

on:
  # 推到 main 就自動重新部署
  push:
    branches: [main]
  # 也可以在 Actions 頁面手動觸發
  workflow_dispatch:

# GitHub Pages 部署需要這三個權限，少一個都會失敗
permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一次部署；不取消進行中的，避免半途中斷留下壞掉的站
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ci 而不是 install：嚴格照 package-lock.json 安裝，
      # 確保線上裝到的版本跟本機完全一致
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
